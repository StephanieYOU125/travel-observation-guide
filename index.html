<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#17324d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="片段整理" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>片段整理｜把零散記憶整理成理解</title>
<style>
:root{--bg:#f6f7f8;--card:#fff;--ink:#18212b;--muted:#6b7280;--brand:#17324d;--accent:#d97706;--line:#e5e7eb;--soft:#edf4f7;--ok:#0f766e;--danger:#9b2c2c}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.wrap{max-width:920px;margin:auto;padding:14px}header{position:sticky;top:0;z-index:10;background:rgba(246,247,248,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand h1{font-size:20px;margin:0}.muted,.brand small{color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;padding:11px 0 2px}.tab,.chip,.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-size:14px;white-space:nowrap}.tab.active,.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
main{padding-bottom:100px}.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:13px 0;box-shadow:0 4px 18px rgba(15,23,42,.04)}h2{font-size:18px;margin:0 0 8px}h3{font-size:16px;margin:0 0 6px}.muted{font-size:14px;line-height:1.6}.hero{background:linear-gradient(135deg,#17324d,#315d78);color:#fff}.hero .muted{color:#dce8ef}.hero h2{font-size:24px}.flow{font-weight:800;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.step{border:1px solid var(--line);border-radius:15px;padding:14px;background:#fff}.step b{display:block;margin-bottom:5px}.step .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:99px;background:var(--brand);color:#fff;margin-bottom:8px}.callout{border-left:4px solid var(--accent);background:#fff8ec;border-radius:10px;padding:11px 12px;line-height:1.6;margin:10px 0}.section-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.section-head .btn{padding:7px 10px}.btn{cursor:pointer}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);border-radius:12px}.btn.ghost,.btn.ok,.btn.danger{border-radius:12px}.btn.ok{color:var(--ok)}.btn.danger{color:var(--danger)}.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1}label{display:block;color:var(--muted);font-size:13px;margin:11px 0 5px}input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}textarea{min-height:86px;resize:vertical}.fragment{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:#fcfcfc}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:var(--soft);font-size:12px;margin-right:5px}.cluster{border:1px dashed #b8c6d1;border-radius:14px;padding:12px;margin:10px 0}.audience-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.audience{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left}.audience.active{outline:2px solid var(--brand);background:var(--soft)}.summary{white-space:pre-wrap;line-height:1.7;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:12px}.editbox{border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:#fafafa}.editbox textarea{min-height:110px}.mini{font-size:12px}.empty{text-align:center;padding:25px 8px;color:var(--muted)}
@media(max-width:650px){.grid,.audience-grid{grid-template-columns:1fr}.brand{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><div class="wrap"><div class="brand"><div><h1 id="appTitle"></h1><small id="appTagline"></small></div><small id="saveState">本機自動儲存</small></div><nav class="tabs">
<button class="tab active" data-tab="home">首頁</button><button class="tab" data-tab="capture">記片段</button><button class="tab" data-tab="organize">整理</button><button class="tab" data-tab="express">表達</button><button class="tab" data-tab="memory">記憶庫</button><button class="tab" data-tab="edit">編輯內容</button>
</nav></div></header>
<main class="wrap">
<section id="home" class="panel active">
  <div class="card hero"><div class="muted" id="heroEyebrow"></div><h2 id="heroTitle"></h2><p class="muted" id="heroText"></p><div class="flow" id="heroFlow"></div></div>
  <div class="card"><div class="section-head"><div><h2 id="problemTitle"></h2><p class="muted" id="problemText"></p></div><button class="btn ghost" onclick="jumpEdit('problem')">✎</button></div></div>
  <div class="card"><div class="section-head"><div><h2 id="processTitle"></h2><p class="muted" id="processText"></p></div><button class="btn ghost" onclick="jumpEdit('process')">✎</button></div><div class="grid" id="processGrid"></div></div>
  <div class="card"><div class="section-head"><div><h2 id="principleTitle"></h2></div><button class="btn ghost" onclick="jumpEdit('principle')">✎</button></div><div class="callout" id="principleText"></div><div class="row"><button class="btn primary" onclick="goTab('capture')">＋ 記一個片段</button><button class="btn ghost" onclick="goTab('organize')">開始整理</button></div></div>
</section>

<section id="capture" class="panel"><div class="card"><div class="section-head"><div><h2 id="captureTitle"></h2><p class="muted" id="captureText"></p></div><button class="btn ghost" onclick="jumpEdit('capture')">✎</button></div>
<label>旅程／展覽／活動</label><input id="eventName" placeholder="例如：WSCE 2026 釜山智慧城市展" />
<label>片段內容</label><textarea id="fragmentText" placeholder="只要先記一句：看到什麼、聽到什麼、想到什麼。"></textarea>
<label>類型</label><select id="fragmentType"></select>
<label>當下感覺／直覺（可選）</label><input id="fragmentFeeling" placeholder="驚訝、懷疑、有趣、想深入…" />
<div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveFragment()">儲存片段</button><button class="btn ghost" onclick="clearCapture()">清空</button></div></div>
<div class="card"><h2>最近片段</h2><div id="recentFragments"></div></div></section>

<section id="organize" class="panel">
<div class="card"><div class="section-head"><div><h2 id="organizeTitle"></h2><p class="muted" id="organizeText"></p></div><button class="btn ghost" onclick="jumpEdit('organize')">✎</button></div><label>選擇活動</label><select id="organizeEvent" onchange="renderOrganizer()"></select><div id="organizeList"></div></div>
<div class="card"><div class="section-head"><div><h2 id="connectTitle"></h2><p class="muted" id="connectText"></p></div><button class="btn ghost" onclick="jumpEdit('connect')">✎</button></div>
<label>共同主題</label><input id="clusterTheme" placeholder="例如：技術成熟度與落地" />
<label>這些片段共同在說什麼？</label><textarea id="clusterMeaning" placeholder="例如：真正困難的不是有沒有 AI，而是能不能落地、維護、被制度接住。"></textarea>
<label>所以呢？｜So what?</label><textarea id="clusterSoWhat" placeholder="這件事為什麼重要？它改變了我什麼理解？"></textarea>
<div class="row"><button class="btn primary" onclick="saveCluster()">儲存整理結果</button></div></div>
<div class="card"><h2>已整理的主題</h2><div id="clusterList"></div></div>
</section>

<section id="express" class="panel"><div class="card"><div class="section-head"><div><h2 id="expressTitle"></h2><p class="muted" id="expressText"></p></div><button class="btn ghost" onclick="jumpEdit('express')">✎</button></div>
<label>選一個已整理主題</label><select id="expressCluster" onchange="loadExpressCluster()"></select>
<label>我要說給誰聽？</label><div class="audience-grid" id="audienceGrid"></div>
<label>一句話核心</label><textarea id="oneLine"></textarea>
<label>整理後表達</label><textarea id="expression"></textarea>
<div class="row"><button class="btn primary" onclick="generateExpression()">依對象產生架構</button><button class="btn ok" onclick="saveExpression()">儲存表達</button></div></div>
<div class="card"><h2>表達提示</h2><div class="callout" id="audienceHint"></div></div></section>

<section id="memory" class="panel"><div class="card"><h2>記憶庫</h2><p class="muted">從片段 → 主題 → 表達，保留經驗如何被整理的過程。</p><label>搜尋</label><input id="searchBox" placeholder="搜尋活動、片段、主題、表達…" oninput="renderMemory()"/><div id="memoryList"></div></div></section>

<section id="edit" class="panel"><div class="card"><h2>編輯 App 每一區塊</h2><p class="muted">所有標題、說明、流程、分類、對象提示都可修改；修改只存在你的瀏覽器，可隨時匯出備份。</p><div id="editor"></div><div class="row"><button class="btn primary" onclick="saveConfigFromEditor()">儲存全部修改</button><button class="btn ghost" onclick="exportAll()">匯出備份</button><button class="btn danger" onclick="resetConfig()">恢復預設</button></div></div></section>
</main>
<script>
const DEFAULT_CONFIG={
 app:{title:'片段整理',tagline:'把零散記憶整理成理解'},
 hero:{eyebrow:'Experience Sensemaking',title:'看很多，不代表留下很多。',text:'把展覽、旅行與參訪中累積的零散記憶片段，整理成真正能說出口、帶得走、再利用的理解。',flow:'Capture 記下來 → Sort 分類 → Connect 連結 → Express 表達 → Reuse 再利用'},
 problem:{title:'這個 App 要解決的問題',text:'我常常看了很多、拍了很多、想了很多，但回來只剩一堆記憶片段，不知道怎麼整理，也不知道怎麼向朋友、主管或教授說清楚。'},
 process:{title:'從片段到理解',text:'不要一開始就逼自己寫完整心得。先留下片段，再慢慢收斂。',steps:[['記下來','先留下現場的一句話、畫面、數字、對話或感受。'],['分類','辨認它在講人、城市、技術、制度、自己，或其他主題。'],['連結','把在說同一件事的片段放在一起，找共同主題。'],['提煉','問「這些片段共同在說什麼？」以及「所以呢？」'],['表達','依朋友、主管、教授、IG 或自己，換成不同說法。'],['再利用','把理解帶回研究、工作、寫作、下一次旅行。']]},
 principle:{title:'核心原則',text:'不要急著把每個片段都解釋完整。先保存，再分類；先看共同模式，再下結論。'},
 capture:{title:'1｜Capture 記片段',text:'現場只要快速抓住重要片段，不需要立刻寫成心得。'},
 organize:{title:'2｜Sort 整理片段',text:'把同一場活動的片段攤開，看哪些其實在講同一件事。'},
 connect:{title:'3｜Connect 連結與提煉',text:'為一組片段命名，寫出共同意思，再補一句「所以呢？」。'},
 express:{title:'4｜Express 轉成能說出口的內容',text:'同一個理解，依對象換語言，不需要每次從零開始。'},
 fragmentTypes:['人物／互動','城市／空間','技術／產品','制度／治理','體驗／飲食','自己的感受','研究／工作聯想','其他'],
 audiences:{
  '自己':'保留細節與矛盾，不急著漂亮。重點是：我看到了什麼？我的理解怎麼改變？',
  '朋友':'先講最有趣的故事，再補一句「我後來發現…」。避免太多術語。',
  '主管':'問題 → 現場觀察 → 可帶回工作的啟發。強調風險、流程、責任、落地。',
  '教授':'觀察 → 尚未解答的問題 → 可研究的變項／假設。區分觀察與推論。',
  'IG／社群':'具體場景 → 自己的發現 → 一句讓人記得的話。不要寫成行程流水帳。',
  '正式報告':'背景 → 主要觀察 → 證據／案例 → 分析 → 建議／下一步。'
 }
};
let config=JSON.parse(localStorage.getItem('senseConfig')||'null')||structuredClone(DEFAULT_CONFIG);
let fragments=JSON.parse(localStorage.getItem('senseFragments')||'[]');
let clusters=JSON.parse(localStorage.getItem('senseClusters')||'[]');
let expressions=JSON.parse(localStorage.getItem('senseExpressions')||'[]');
let audience=Object.keys(config.audiences)[0];
const $=id=>document.getElementById(id);const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function savePulse(t='已儲存 ✓'){$('saveState').textContent=t;setTimeout(()=>$('saveState').textContent='本機自動儲存',1200)}
function persist(){localStorage.setItem('senseFragments',JSON.stringify(fragments));localStorage.setItem('senseClusters',JSON.stringify(clusters));localStorage.setItem('senseExpressions',JSON.stringify(expressions));}
function goTab(id){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id));if(id==='organize')renderOrganizer();if(id==='express')renderExpress();if(id==='memory')renderMemory();if(id==='edit')renderEditor();}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>goTab(b.dataset.tab));
function renderStatic(){
 $('appTitle').textContent=config.app.title;$('appTagline').textContent=config.app.tagline;$('heroEyebrow').textContent=config.hero.eyebrow;$('heroTitle').textContent=config.hero.title;$('heroText').textContent=config.hero.text;$('heroFlow').textContent=config.hero.flow;
 ['problem','process','principle','capture','organize','connect','express'].forEach(k=>{if($(k+'Title'))$(k+'Title').textContent=config[k].title;if($(k+'Text'))$(k+'Text').textContent=config[k].text});
 $('processGrid').innerHTML=config.process.steps.map((s,i)=>`<div class="step"><span class="n">${i+1}</span><b>${esc(s[0])}</b><div class="muted">${esc(s[1])}</div></div>`).join('');$('principleText').textContent=config.principle.text;
 $('fragmentType').innerHTML=config.fragmentTypes.map(x=>`<option>${esc(x)}</option>`).join('');renderAudience();
}
function saveFragment(){let text=$('fragmentText').value.trim();if(!text){alert('先寫下一個片段。');return}fragments.unshift({id:Date.now(),event:$('eventName').value.trim()||'未命名活動',text,type:$('fragmentType').value,feeling:$('fragmentFeeling').value.trim(),created:new Date().toISOString()});persist();clearCapture();renderRecent();renderEventOptions();savePulse();}
function clearCapture(){$('fragmentText').value='';$('fragmentFeeling').value=''}
function renderRecent(){$('recentFragments').innerHTML=fragments.slice(0,6).map(f=>`<div class="fragment"><span class="tag">${esc(f.type)}</span><span class="tag">${esc(f.event)}</span><div style="margin-top:7px">${esc(f.text)}</div>${f.feeling?`<div class="muted mini">感覺：${esc(f.feeling)}</div>`:''}<div style="margin-top:7px"><button class="btn ghost" onclick="editFragment(${f.id})">編輯</button> <button class="btn danger" onclick="deleteFragment(${f.id})">刪除</button></div></div>`).join('')||'<div class="empty">還沒有片段。</div>'}
function editFragment(id){let f=fragments.find(x=>x.id===id);let t=prompt('編輯片段',f.text);if(t!==null&&t.trim()){f.text=t.trim();persist();renderRecent();renderOrganizer();renderMemory();}}
function deleteFragment(id){if(confirm('刪除這個片段？')){fragments=fragments.filter(x=>x.id!==id);persist();renderRecent();renderOrganizer();renderMemory();}}
function events(){return [...new Set(fragments.map(f=>f.event))]}
function renderEventOptions(){let es=events();$('organizeEvent').innerHTML=es.map(e=>`<option>${esc(e)}</option>`).join('')||'<option>尚無活動</option>';}
function renderOrganizer(){renderEventOptions();let e=$('organizeEvent').value;let list=fragments.filter(f=>f.event===e);$('organizeList').innerHTML=list.map(f=>`<div class="fragment"><span class="tag">${esc(f.type)}</span><div style="margin-top:6px">${esc(f.text)}</div></div>`).join('')||'<div class="empty">先去「記片段」留下內容。</div>';renderClusters();}
function saveCluster(){let theme=$('clusterTheme').value.trim(),meaning=$('clusterMeaning').value.trim();if(!theme||!meaning){alert('請至少填共同主題與共同意思。');return}clusters.unshift({id:Date.now(),event:$('organizeEvent').value,theme,meaning,soWhat:$('clusterSoWhat').value.trim(),created:new Date().toISOString()});persist();['clusterTheme','clusterMeaning','clusterSoWhat'].forEach(x=>$(x).value='');renderClusters();renderExpress();savePulse();}
function renderClusters(){$('clusterList').innerHTML=clusters.map(c=>`<div class="cluster"><span class="tag">${esc(c.event)}</span><h3 style="margin-top:7px">${esc(c.theme)}</h3><div>${esc(c.meaning)}</div>${c.soWhat?`<div class="muted" style="margin-top:7px"><b>So what：</b>${esc(c.soWhat)}</div>`:''}<div style="margin-top:8px"><button class="btn ghost" onclick="editCluster(${c.id})">編輯</button> <button class="btn danger" onclick="deleteCluster(${c.id})">刪除</button></div></div>`).join('')||'<div class="empty">還沒有整理出的主題。</div>'}
function editCluster(id){let c=clusters.find(x=>x.id===id);let t=prompt('共同主題',c.theme);if(t===null)return;let m=prompt('共同意思',c.meaning);if(m===null)return;c.theme=t.trim()||c.theme;c.meaning=m.trim()||c.meaning;persist();renderClusters();renderExpress();renderMemory();}
function deleteCluster(id){if(confirm('刪除這個主題？')){clusters=clusters.filter(x=>x.id!==id);persist();renderClusters();renderExpress();renderMemory();}}
function renderAudience(){let keys=Object.keys(config.audiences);if(!keys.includes(audience))audience=keys[0];$('audienceGrid').innerHTML=keys.map(a=>`<button class="audience ${a===audience?'active':''}" onclick="setAudience('${a.replaceAll("'","\\'")}')"><b>${esc(a)}</b><div class="muted mini">${esc(config.audiences[a])}</div></button>`).join('');$('audienceHint').textContent=config.audiences[audience]||'';}
function setAudience(a){audience=a;renderAudience();}
function renderExpress(){$('expressCluster').innerHTML=clusters.map(c=>`<option value="${c.id}">${esc(c.event)}｜${esc(c.theme)}</option>`).join('')||'<option value="">尚無主題</option>';renderAudience();loadExpressCluster();}
function loadExpressCluster(){let c=clusters.find(x=>String(x.id)===$('expressCluster').value);if(!c)return;$('oneLine').value=c.soWhat||c.meaning;$('expression').value='';}
function generateExpression(){let c=clusters.find(x=>String(x.id)===$('expressCluster').value);if(!c){alert('先整理一個主題。');return}let base=c.soWhat||c.meaning;let map={
 '自己':`我看到：${c.meaning}\n\n我目前的理解：${base}\n\n我還想繼續追問：＿＿＿`,
 '朋友':`我這次看到一件很有意思的事：${c.meaning}\n\n我後來才發現，${base}`,
 '主管':`這次觀察到：${c.meaning}\n\n我認為對工作最有價值的啟發是：${base}\n\n若要應用，可再確認責任、流程、成本與成效。`,
 '教授':`現場觀察：${c.meaning}\n\n這讓我形成一個值得繼續研究的問題：${base}\n\n後續可再區分觀察、推論與可驗證證據。`,
 'IG／社群':`我原本只是看到＿＿＿。\n\n但後來發現：${base}\n\n也許真正值得帶走的，不只是照片，而是這個理解。`,
 '正式報告':`【主題】${c.theme}\n【主要觀察】${c.meaning}\n【意義】${base}\n【後續建議】＿＿＿`
};$('expression').value=map[audience]||`${c.meaning}\n\n${base}`;}
function saveExpression(){let c=clusters.find(x=>String(x.id)===$('expressCluster').value);let text=$('expression').value.trim();if(!c||!text){alert('請先選主題並整理表達。');return}expressions.unshift({id:Date.now(),clusterId:c.id,event:c.event,theme:c.theme,audience,oneLine:$('oneLine').value.trim(),text,created:new Date().toISOString()});persist();savePulse('表達已儲存 ✓');}
function renderMemory(){let q=$('searchBox').value.trim().toLowerCase();let items=[];fragments.forEach(f=>items.push({type:'片段',event:f.event,title:f.type,text:f.text}));clusters.forEach(c=>items.push({type:'主題',event:c.event,title:c.theme,text:c.meaning+(c.soWhat?'\n'+c.soWhat:'')}));expressions.forEach(e=>items.push({type:'表達',event:e.event,title:e.theme+'｜'+e.audience,text:e.text}));if(q)items=items.filter(x=>(x.event+' '+x.title+' '+x.text).toLowerCase().includes(q));$('memoryList').innerHTML=items.map(x=>`<div class="fragment"><span class="tag">${x.type}</span><span class="tag">${esc(x.event)}</span><h3 style="margin-top:7px">${esc(x.title)}</h3><div class="muted" style="white-space:pre-wrap">${esc(x.text)}</div></div>`).join('')||'<div class="empty">沒有符合的內容。</div>'}
function jumpEdit(key){goTab('edit');setTimeout(()=>document.getElementById('edit-'+key)?.scrollIntoView({behavior:'smooth',block:'center'}),50)}
function renderEditor(){let html='';let simple=['app','hero','problem','principle','capture','organize','connect','express'];simple.forEach(k=>{let o=config[k];html+=`<div class="editbox" id="edit-${k}"><h3>${k}</h3>${Object.entries(o).filter(([a,v])=>typeof v==='string').map(([a,v])=>`<label>${a}</label>${v.length>70?`<textarea data-path="${k}.${a}">${esc(v)}</textarea>`:`<input data-path="${k}.${a}" value="${esc(v)}">`}`).join('')}</div>`});html+=`<div class="editbox" id="edit-process"><h3>process 流程</h3><label>title</label><input data-path="process.title" value="${esc(config.process.title)}"><label>text</label><textarea data-path="process.text">${esc(config.process.text)}</textarea><label>steps（每行：標題｜說明）</label><textarea data-special="steps">${config.process.steps.map(x=>x.join('｜')).join('\n')}</textarea></div>`;html+=`<div class="editbox"><h3>片段分類</h3><label>每行一個分類</label><textarea data-special="types">${config.fragmentTypes.join('\n')}</textarea></div>`;html+=`<div class="editbox"><h3>表達對象與提示</h3><p class="muted">每行格式：對象｜提示</p><textarea data-special="audiences" style="min-height:220px">${Object.entries(config.audiences).map(([k,v])=>k+'｜'+v).join('\n')}</textarea></div>`;$('editor').innerHTML=html;}
function setPath(obj,path,val){let p=path.split('.');obj[p[0]][p[1]]=val}
function saveConfigFromEditor(){document.querySelectorAll('[data-path]').forEach(el=>setPath(config,el.dataset.path,el.value.trim()));let steps=document.querySelector('[data-special="steps"]').value.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{let [a,...b]=x.split('｜');return[a.trim(),b.join('｜').trim()]});if(steps.length)config.process.steps=steps;let types=document.querySelector('[data-special="types"]').value.split('\n').map(x=>x.trim()).filter(Boolean);if(types.length)config.fragmentTypes=types;let aud={};document.querySelector('[data-special="audiences"]').value.split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>{let [a,...b]=x.split('｜');if(a&&b.length)aud[a.trim()]=b.join('｜').trim()});if(Object.keys(aud).length)config.audiences=aud;localStorage.setItem('senseConfig',JSON.stringify(config));renderStatic();renderRecent();renderOrganizer();renderExpress();savePulse('設定已儲存 ✓');}
function resetConfig(){if(confirm('恢復所有預設文字與分類？你的記憶片段不會被刪除。')){config=structuredClone(DEFAULT_CONFIG);localStorage.setItem('senseConfig',JSON.stringify(config));renderStatic();renderEditor();savePulse();}}
function exportAll(){let data={exportedAt:new Date().toISOString(),config,fragments,clusters,expressions};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sensemaking-backup.json';a.click();URL.revokeObjectURL(a.href)}
renderStatic();renderRecent();renderEventOptions();renderOrganizer();renderExpress();renderMemory();
</script>
</body></html>
